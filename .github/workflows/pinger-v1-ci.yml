
name: Pinger V1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pinger/v1/**'
      - '.github/workflows/**'

  push:
    branches: [main]
    paths:
      - 'app/pinger/v1/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  pinger-v1-ci:
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      service-name: pinger-v1
      service-directory: app/pinger/v1
      image-name: pinger-v1
      sonar-organization: rylvishal
      sonar-project-key: pingerapp-pinger-v1
    secrets: inherit
